version: 2
updates:
  # Actions used by the CI/deploy workflows in .github/workflows/.
  # Routine npm version updates are disabled to avoid PR noise; security
  # vulnerabilities in npm dependencies are handled via Dependabot grouped
  # security updates configured in repository settings.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
